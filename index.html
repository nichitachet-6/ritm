<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RITM · agenție creativă</title>
<meta name="description" content="RITM, agenție creativă: brand, filmare, social media și reclame.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='60 160 180 300'%3E%3Cpath fill='%23F7D31C' d='M96 446 L96 270 L134 270 L134 272 A74 86 0 0 1 208 186 L208 204 A56 68 0 0 0 152 272 L152 446 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@300;500&display=swap">
<style>
/* VOICE: o singură scenă, ca un logo animat la începutul unui film
   IDEA: logo-ul se construiește pe bătăi și rămâne să pulseze
   PICTURE: „ritm” mare, centrat, cu barele în gradientul lime → foc
   COLOUR and TYPE: alb, cerneală #12162B, gradient lime → foc; Montserrat 300 + Inter
   LAYOUT: logo în centrul ecranului, contactele pe un rând jos */
:root{--ink:#12162B;--mut:#5A6078;--line:#E6E3DD;--g:linear-gradient(180deg,#B6FF17,#D9F21A 25%,#F7D31C 50%,#FF9A22 75%,#FE5126)}
*{box-sizing:border-box;margin:0;min-width:0}
html,body{height:100%}
body{background:#fff;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100svh;overflow-x:clip}
main{flex:1;display:grid;place-items:center;padding:48px max(5vw,20px) 24px}
.stage{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,3vw,36px);width:100%}
.logo{width:min(78vw,880px);height:auto;display:block;cursor:pointer;overflow:visible}
.logo .t{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--b)*.12s + .25s)}
.logo .x{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--b)*.12s + .25s)}
.logo .dot{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:grow .45s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(var(--b)*.12s + .25s)}
.logo .arc{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out both;animation-delay:calc(var(--b)*.12s + .25s)}
.logo .beat{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:rise .7s cubic-bezier(.3,1.6,.5,1) both,pulse 1.3s ease-in-out infinite;animation-delay:calc(var(--b)*.12s + .25s),calc(var(--b)*.12s + 1.5s + var(--off,0s))}
@keyframes grow{to{transform:none}}
@keyframes rise{to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,40%,100%{transform:scaleY(1)}14%{transform:scaleY(.74)}}
.tag{font:300 clamp(20px,2.6vw,34px)/1.25 Montserrat,sans-serif;letter-spacing:-.01em;text-align:center;opacity:0;animation:fade .8s ease-out 1.9s both}
.tag b{font-weight:500}
.sub{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);opacity:0;animation:fade .8s ease-out 2.2s both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eq{display:flex;align-items:flex-end;gap:6px;height:56px;width:min(78vw,880px);opacity:0;animation:fade .6s ease-out 2.4s both}
.eq i{flex:1;height:100%;background:var(--g);transform-origin:50% 100%;animation:eq var(--d) ease-in-out var(--dl) infinite alternate;border-radius:1px}
.eq i:nth-child(even){flex:.28;background:var(--ink)}
@keyframes eq{from{transform:scaleY(var(--lo))}to{transform:scaleY(var(--hi))}}
footer{border-top:1px solid var(--line);padding:22px max(5vw,20px);display:flex;flex-wrap:wrap;gap:14px 40px;align-items:center;justify-content:space-between;opacity:0;animation:fade .8s ease-out 2.6s both}
.contacts{display:flex;flex-wrap:wrap;gap:12px 36px}
.c{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.c span{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.c strong{font-weight:500;font-size:16px}
a.c:hover strong{background:linear-gradient(90deg,#B6FF17,#FE5126) no-repeat 0 100%/100% 2px}
.copy{font-size:13px;color:var(--mut)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:600px){footer{justify-content:flex-start}.eq{height:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.logo .t,.logo .x,.logo .dot,.logo .beat{transform:none}.logo .arc{stroke-dashoffset:0}.tag,.sub,.eq,footer{opacity:1}}
</style>
</head>
<body>
<main>
  <div class="stage">
    <svg class="logo" id="logo" viewBox="80 80 820 380" role="img" aria-label="RITM">
      <defs><linearGradient id="G" gradientUnits="userSpaceOnUse" x1="0" y1="186" x2="0" y2="446"><stop offset="0" stop-color="#B6FF17"/><stop offset=".25" stop-color="#D9F21A"/><stop offset=".5" stop-color="#F7D31C"/><stop offset=".75" stop-color="#FF9A22"/><stop offset="1" stop-color="#FE5126"/></linearGradient></defs>
      <rect class="t" style="--b:0" x="265" y="186" width="18" height="260" fill="#12162B"/>
      <rect class="dot" style="--b:1" x="261" y="120" width="26" height="26" fill="#12162B"/>
      <rect class="t" style="--b:2" x="415" y="96" width="18" height="350" fill="#12162B"/>
      <rect class="x" style="--b:3" x="361" y="186" width="126" height="18" fill="#12162B"/>
      <path class="arc" style="--b:4" pathLength="1" d="M593 272 A65.5 77 0 0 1 724 272" stroke="#12162B" stroke-width="18" fill="none"/>
      <path class="arc" style="--b:5" pathLength="1" d="M724 272 A75 77 0 0 1 874 272" stroke="#12162B" stroke-width="18" fill="none"/>
      <rect class="t" style="--b:5" x="715" y="268" width="18" height="178" fill="#12162B"/>
      <rect class="t" style="--b:6" x="865" y="268" width="18" height="178" fill="#12162B"/>
      <path class="beat" style="--b:7" fill="url(#G)" d="M96 446 L96 270 L134 270 L134 272 A74 86 0 0 1 208 186 L208 204 A56 68 0 0 0 152 272 L152 446 Z"/>
      <rect class="beat" style="--b:8;--off:.65s" x="546" y="270" width="56" height="176" fill="url(#G)"/>
    </svg>
    <p class="tag">Afacerea ta, <b>filmată și pusă în ritm.</b></p>
    <p class="sub">Agenție creativă</p>
    <div class="eq" id="eq" aria-hidden="true"></div>
  </div>
</main>
<footer>
  <div class="contacts">
    <a class="c" href="mailto:salut@ritm.md"><span>Email</span><strong>salut@ritm.md</strong></a>
    <a class="c" href="tel:+37362050151"><span>Telefon</span><strong>+373 62 050 151</strong></a>
    <a class="c" href="https://instagram.com/ritm.agency"><span>Instagram</span><strong>@ritm.agency</strong></a>
  </div>
</footer>
<script>
{
let s=11;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const eq=document.getElementById('eq');
eq.innerHTML=Array.from({length:48},()=>`<i style="--d:${(0.6+R()*1).toFixed(2)}s;--dl:-${(R()*2).toFixed(2)}s;--lo:${(0.08+R()*.15).toFixed(2)};--hi:${(0.45+R()*.55).toFixed(2)}"></i>`).join('');
const logo=document.getElementById('logo');
logo.addEventListener('click',()=>{const c=logo.cloneNode(true);logo.replaceWith(c);c.id='logo';c.addEventListener('click',()=>location.reload())});
}
</script>
</body>
</html>
